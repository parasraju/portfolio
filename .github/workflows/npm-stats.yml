name: Refresh npm download stats

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "npm-stats"
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fetch total downloads
        run: npm run stats:npm
      - name: Commit updated stats
        id: commit
        run: |
          if git diff --quiet -- src/data/npm-stats.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/npm-stats.json
          git commit -m "chore: refresh npm download stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Redeploy site
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
